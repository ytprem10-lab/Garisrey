<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Masuk — Garisrey</title>
  <meta name="description" content="Masuk atau daftar ke Garisrey. From East to Peace."/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --red:#CC0000;--red-dk:#990000;
      --black:#080808;--black2:#111;--black3:#1a1a1a;
      --white:#FAFAFA;--gray:#666;--gray2:#333;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{height:100%}
    body{
      font-family:'Space Mono',monospace;
      background:var(--black);color:var(--white);
      min-height:100vh;overflow:hidden;
      display:grid;grid-template-columns:1fr 1fr;
    }
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    ::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:var(--red)}

    /* ── LOADER ── */
    #pgLoader{
      position:fixed;inset:0;z-index:9999;background:var(--black);
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
      transition:opacity .5s
    }
    #pgLoader.out{opacity:0;pointer-events:none}
    .loader-logo{height:28px;filter:brightness(0) invert(1);opacity:.7;animation:lf 1.4s ease-in-out infinite}
    @keyframes lf{0%,100%{opacity:.3}50%{opacity:.9}}
    .loader-bar{width:160px;height:1px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:6px}
    .loader-fill{height:100%;background:var(--red);animation:lb 1.6s ease-in-out infinite}
    @keyframes lb{0%{width:0%;margin-left:0}50%{width:75%;margin-left:0}100%{width:0%;margin-left:100%}}

    /* ── LEFT PANEL (brand visual) ── */
    .panel-left{
      position:relative;overflow:hidden;background:var(--black2);
      display:flex;flex-direction:column;
    }
    .panel-bg{position:absolute;inset:0}
    .panel-bg img,.panel-bg video{width:100%;height:100%;object-fit:cover;opacity:.4}
    .panel-overlay{
      position:absolute;inset:0;
      background:linear-gradient(160deg,rgba(8,8,8,.2) 0%,rgba(8,8,8,.5) 50%,rgba(8,8,8,.95) 100%)
    }
    .panel-content{
      position:relative;z-index:2;
      display:flex;flex-direction:column;justify-content:space-between;
      height:100%;padding:36px 40px;
    }
    .panel-brand{display:flex;align-items:center;gap:12px}
    .panel-logo{height:24px;filter:brightness(0) invert(1);opacity:.9}
    .panel-wordmark{font-family:'DM Serif Display',serif;font-style:italic;font-size:18px}
    .panel-wordmark span{color:var(--red)}
    .panel-bottom{}
    .panel-quote{
      font-family:'DM Serif Display',serif;font-style:italic;
      font-size:clamp(28px,3.5vw,46px);line-height:.95;
      margin-bottom:16px;max-width:400px;
    }
    .panel-quote em{color:var(--red)}
    .panel-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:32px}
    .panel-tags{display:flex;gap:8px;flex-wrap:wrap}
    .panel-tag{
      font-size:7px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
      padding:5px 12px;border:1px solid rgba(255,255,255,.12);border-radius:100px;
      color:rgba(255,255,255,.4)
    }
    .panel-stiker{position:absolute;bottom:40px;right:40px;width:100px;opacity:.15;filter:brightness(0) invert(1)}

    /* ── RIGHT PANEL (form) ── */
    .panel-right{
      display:flex;align-items:center;justify-content:center;
      padding:32px 28px;overflow-y:auto;background:var(--black);
      position:relative;
    }
    .panel-right::before{
      content:'';position:absolute;left:0;top:10%;bottom:10%;
      width:1px;background:linear-gradient(to bottom,transparent,rgba(204,0,0,.2),transparent)
    }
    .form-wrap{width:100%;max-width:360px}

    .form-header{margin-bottom:32px}
    .form-eyebrow{
      font-size:7px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;
      color:var(--red);display:flex;align-items:center;gap:8px;margin-bottom:14px
    }
    .form-eyebrow::before{content:'';width:18px;height:1px;background:var(--red)}
    .form-title{font-family:'DM Serif Display',serif;font-size:32px;line-height:.95;margin-bottom:6px}
    .form-title em{font-style:italic;color:var(--red)}
    .form-desc{font-size:10px;color:var(--gray);letter-spacing:.08em;line-height:1.7}

    /* TABS */
    .tabs{display:flex;border:1px solid rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-bottom:24px}
    .tab{
      flex:1;padding:10px;font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
      cursor:pointer;transition:all .2s;color:rgba(255,255,255,.3);text-align:center;
      background:transparent;border:none;font-family:inherit
    }
    .tab.on{background:var(--red);color:var(--white)}

    /* ALERT */
    .alert{
      padding:10px 13px;border-radius:2px;font-size:10px;margin-bottom:14px;
      animation:fadeIn .2s;line-height:1.6;display:none
    }
    .alert.show{display:block}
    .alert-err{background:rgba(204,0,0,.08);border:1px solid rgba(204,0,0,.25);color:#ff7070}
    .alert-ok{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);color:#4ade80}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

    /* FIELDS */
    .field{margin-bottom:14px}
    .field label{
      display:block;font-size:7px;font-weight:700;letter-spacing:.28em;
      text-transform:uppercase;color:var(--gray);margin-bottom:7px
    }
    .field-inp-wrap{position:relative}
    .field input{
      width:100%;padding:12px 14px;
      background:var(--black3);border:1px solid rgba(255,255,255,.07);
      color:var(--white);border-radius:2px;font-size:12px;
      outline:none;font-family:inherit;transition:border-color .2s
    }
    .field input:focus{border-color:var(--red)}
    .field input::placeholder{color:var(--gray2)}
    .toggle-pass{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      font-size:11px;color:var(--gray);cursor:pointer;transition:color .2s;
      letter-spacing:.1em;font-weight:700
    }
    .toggle-pass:hover{color:var(--white)}

    .forgot{
      display:block;text-align:right;font-size:9px;color:var(--gray);
      margin-top:-6px;margin-bottom:18px;cursor:pointer;transition:color .2s
    }
    .forgot:hover{color:var(--red)}

    /* SUBMIT BTN */
    .btn-submit{
      width:100%;padding:13px;background:var(--red);color:var(--white);
      border:1px solid var(--red);border-radius:2px;font-family:inherit;
      font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
      cursor:pointer;transition:all .25s;margin-bottom:12px;
      display:flex;align-items:center;justify-content:center;gap:8px
    }
    .btn-submit:hover{background:transparent;color:var(--red)}
    .btn-submit:disabled{opacity:.4;cursor:not-allowed}
    .btn-submit .spinner-sm{
      width:12px;height:12px;border:2px solid rgba(255,255,255,.3);
      border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none
    }
    .btn-submit.loading .spinner-sm{display:block}
    .btn-submit.loading .btn-txt{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* DIVIDER */
    .divider{
      display:flex;align-items:center;gap:12px;margin-bottom:14px;
      font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)
    }
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}

    /* BACK LINK */
    .back-link{
      display:flex;align-items:center;gap:6px;
      font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
      color:rgba(255,255,255,.25);transition:color .2s;cursor:pointer;
      margin-top:20px;justify-content:center
    }
    .back-link:hover{color:rgba(255,255,255,.6)}

    /* STRENGTH INDICATOR */
    .strength-bar{display:flex;gap:3px;margin-top:6px;height:2px}
    .strength-seg{flex:1;border-radius:1px;background:rgba(255,255,255,.08);transition:background .3s}
    .strength-seg.w{background:#ef4444}
    .strength-seg.m{background:var(--yellow,#eab308)}
    .strength-seg.s{background:#22c55e}
    .strength-txt{font-size:8px;color:var(--gray);margin-top:4px}

    /* RESPONSIVE */
    @media(max-width:768px){
      body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
      .panel-left{min-height:200px;max-height:220px}
      .panel-content{padding:20px 24px}
      .panel-quote{font-size:22px}
      .panel-right{padding:28px 20px}
      .panel-right::before{display:none}
      .form-wrap{max-width:100%}
    }
    @media(max-width:480px){
      .panel-left{min-height:160px}
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="pgLoader">
  <img class="loader-logo" id="loaderLogo" src="../logo/logoputih.jpeg" alt="Garisrey"
    onerror="this.src=''; this.style.display='none'"/>
  <div class="loader-bar"><div class="loader-fill"></div></div>
</div>

<!-- LEFT PANEL -->
<div class="panel-left">
  <div class="panel-bg" id="panelBg">
    <!-- media loaded by JS -->
  </div>
  <div class="panel-overlay"></div>
  <div class="panel-content">
    <a class="panel-brand" href="../index.html">
      <img class="panel-logo" id="panelLogo" src="../logo/logoputih.jpeg" alt="Garisrey"
        onerror="this.style.display='none'"/>
      <span class="panel-wordmark">Garis<span>rey.</span></span>
    </a>
    <div class="panel-bottom">
      <h2 class="panel-quote">From East<br>to <em>Peace.</em></h2>
      <p class="panel-sub">Brand fashion lokal Indonesia</p>
      <div class="panel-tags">
        <span class="panel-tag">Denim Culture</span>
        <span class="panel-tag">Local Pride</span>
        <span class="panel-tag">SS 2025</span>
        <span class="panel-tag">Made in ID</span>
      </div>
    </div>
  </div>
  <img class="panel-stiker" id="panelStiker" src="../logo/stiker.png" alt=""
    onerror="this.style.display='none'"/>
</div>

<!-- RIGHT PANEL -->
<div class="panel-right">
  <div class="form-wrap">
    <div class="form-header">
      <div class="form-eyebrow">Member Area</div>
      <h1 class="form-title">Selamat<br><em>Datang.</em></h1>
      <p class="form-desc">Masuk untuk melihat koleksi eksklusif<br>dan order lebih mudah.</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab on" id="tabMasuk" onclick="switchTab('masuk')">Masuk</button>
      <button class="tab" id="tabDaftar" onclick="switchTab('daftar')">Daftar</button>
    </div>

    <!-- ALERT -->
    <div class="alert" id="alertBox"></div>

    <!-- EMAIL -->
    <div class="field">
      <label>Email</label>
      <div class="field-inp-wrap">
        <input type="email" id="emailIn" placeholder="kamu@email.com" autocomplete="email"/>
      </div>
    </div>

    <!-- PASSWORD -->
    <div class="field">
      <label>Password</label>
      <div class="field-inp-wrap">
        <input type="password" id="passIn" placeholder="••••••••" autocomplete="current-password"
          onkeyup="onPassKey(event)"/>
        <span class="toggle-pass" onclick="togglePass('passIn',this)">SHOW</span>
      </div>
      <!-- Password strength (daftar only) -->
      <div id="strengthWrap" style="display:none">
        <div class="strength-bar">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>
        <div class="strength-txt" id="strengthTxt"></div>
      </div>
    </div>

    <!-- CONFIRM PASSWORD (daftar only) -->
    <div class="field" id="confirmField" style="display:none">
      <label>Konfirmasi Password</label>
      <div class="field-inp-wrap">
        <input type="password" id="confirmIn" placeholder="••••••••" autocomplete="new-password"/>
        <span class="toggle-pass" onclick="togglePass('confirmIn',this)">SHOW</span>
      </div>
    </div>

    <!-- FORGOT (masuk only) -->
    <span class="forgot" id="forgotLink" onclick="doForgot()">Lupa password?</span>

    <!-- SUBMIT -->
    <button class="btn-submit" id="authBtn" onclick="doAuth()">
      <div class="spinner-sm"></div>
      <span class="btn-txt" id="authBtnTxt">Masuk →</span>
    </button>

    <!-- DIVIDER -->
    <div class="divider">atau</div>

    <!-- GUEST LINK -->
    <a class="btn-submit" href="../pages/shop.html"
      style="background:transparent;border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.5);text-decoration:none;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:11px;display:flex;align-items:center;justify-content:center;border-radius:2px;transition:all .25s"
      onmouseover="this.style.borderColor='rgba(255,255,255,.4)';this.style.color='#fff'"
      onmouseout="this.style.borderColor='rgba(255,255,255,.12)';this.style.color='rgba(255,255,255,.5)'">
      Lihat Toko Tanpa Login
    </a>

    <a class="back-link" href="../index.html">← Kembali ke Beranda</a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL  = 'https://dhfelzylnicdskzibsqx.supabase.co';
const SUPABASE_ANON = 'sb_publishable_anhuhVrAepwy4EcS5nMunQ_rYBSgBGH';
const ADMIN_EMAIL   = 'ytpremmalang10@gmail.com';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

let mode = 'masuk';

/* ── CHECK SESSION ── */
async function checkSession(){
  const{data:{session}} = await sb.auth.getSession();
  if(session?.user){
    redirect(session.user.email);
    return true;
  }
  return false;
}

function redirect(email){
  if(email === ADMIN_EMAIL) window.location.href = 'admin.html';
  else window.location.href = 'shop.html';
}

/* ── LOAD MEDIA ── */
async function loadMedia(){
  // Panel background: coba local img/ dulu lalu Supabase
  const bg = document.getElementById('panelBg');
  const localImgs = ['../img/3.jpeg','../img/1.jpeg','../img/2.jpeg','../img/4.jpeg'];
  for(const src of localImgs){
    const ok = await fetch(src,{method:'HEAD'}).then(r=>r.ok).catch(()=>false);
    if(ok){
      bg.innerHTML = `<img src="${src}" alt="Garisrey"/>`;
      break;
    }
  }
  if(!bg.innerHTML){
    // Fallback: Supabase products folder
    const{data:items} = await sb.storage.from('assets').list('products',{limit:1});
    if(items?.length){
      const{data} = sb.storage.from('assets').getPublicUrl(`products/${items[0].name}`);
      bg.innerHTML = `<img src="${data.publicUrl}" alt="Garisrey"/>`;
    }
  }

  // Logo fallback ke Supabase jika local tidak ada
  const localLogoOk = await fetch('../logo/logoputih.jpeg',{method:'HEAD'}).then(r=>r.ok).catch(()=>false);
  if(!localLogoOk){
    const exts=['jpeg','jpg','png','webp'];
    for(const ext of exts){
      const{data}=sb.storage.from('assets').getPublicUrl(`logo/logoputih.${ext}`);
      const ok=await fetch(data.publicUrl,{method:'HEAD'}).then(r=>r.ok).catch(()=>false);
      if(ok){
        ['loaderLogo','panelLogo'].forEach(id=>{
          const el=document.getElementById(id);if(el){el.src=data.publicUrl;el.style.display='block';}
        });
        break;
      }
    }
  }

  // Stiker fallback
  const localStikerOk = await fetch('../logo/stiker.png',{method:'HEAD'}).then(r=>r.ok).catch(()=>false);
  if(!localStikerOk){
    const{data}=sb.storage.from('assets').getPublicUrl('logo/stiker.png');
    const el=document.getElementById('panelStiker');
    if(el) el.src=data.publicUrl;
  }
}

/* ── TAB SWITCH ── */
window.switchTab = t => {
  mode = t;
  document.getElementById('tabMasuk').classList.toggle('on', t==='masuk');
  document.getElementById('tabDaftar').classList.toggle('on', t==='daftar');
  document.getElementById('confirmField').style.display = t==='daftar' ? 'block' : 'none';
  document.getElementById('forgotLink').style.display   = t==='masuk'  ? 'block' : 'none';
  document.getElementById('strengthWrap').style.display = t==='daftar' ? 'block' : 'none';
  document.getElementById('authBtnTxt').textContent     = t==='masuk'  ? 'Masuk →' : 'Daftar →';
  document.getElementById('passIn').autocomplete        = t==='masuk'  ? 'current-password' : 'new-password';
  hideAlert();
};

/* ── PASSWORD TOGGLE ── */
window.togglePass = (inputId, btn) => {
  const inp = document.getElementById(inputId);
  if(inp.type==='password'){ inp.type='text'; btn.textContent='HIDE'; }
  else{ inp.type='password'; btn.textContent='SHOW'; }
};

/* ── PASSWORD STRENGTH ── */
window.onPassKey = ev => {
  if(mode==='daftar') checkStrength(ev.target.value);
  if(ev.key==='Enter') doAuth();
};
function checkStrength(val){
  const segs = [document.getElementById('seg1'),document.getElementById('seg2'),document.getElementById('seg3'),document.getElementById('seg4')];
  const txt = document.getElementById('strengthTxt');
  segs.forEach(s=>s.className='strength-seg');
  if(!val){ txt.textContent=''; return; }
  let score = 0;
  if(val.length >= 6)  score++;
  if(val.length >= 10) score++;
  if(/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
  if(/[^A-Za-z0-9]/.test(val)) score++;
  const cls  = score<=1 ? 'w' : score===2 ? 'm' : 's';
  const label= score<=1 ? 'Lemah' : score===2 ? 'Cukup' : score===3 ? 'Kuat' : 'Sangat Kuat';
  for(let i=0;i<score;i++) segs[i].classList.add(cls);
  txt.textContent = label;
}

/* ── ALERT ── */
const showAlert = (msg, type='err') => {
  const el=document.getElementById('alertBox');
  el.textContent=msg; el.className=`alert alert-${type} show`;
};
const hideAlert = () => {
  const el=document.getElementById('alertBox');
  el.className='alert'; el.textContent='';
};

/* ── AUTH ── */
window.doAuth = async () => {
  const email   = document.getElementById('emailIn').value.trim();
  const pass    = document.getElementById('passIn').value;
  const btn     = document.getElementById('authBtn');
  hideAlert();

  if(!email){ showAlert('Email wajib diisi.'); return; }
  if(!pass){  showAlert('Password wajib diisi.'); return; }

  btn.classList.add('loading'); btn.disabled=true;

  try{
    if(mode==='masuk'){
      const{error} = await sb.auth.signInWithPassword({email, password:pass});
      if(error) throw error;
    } else {
      const confirm = document.getElementById('confirmIn').value;
      if(pass !== confirm){ showAlert('Password tidak cocok.'); btn.classList.remove('loading'); btn.disabled=false; return; }
      if(pass.length < 6){  showAlert('Password minimal 6 karakter.');  btn.classList.remove('loading'); btn.disabled=false; return; }
      const{error} = await sb.auth.signUp({email, password:pass});
      if(error) throw error;
      showAlert('Akun berhasil dibuat! Cek email untuk konfirmasi, lalu masuk.','ok');
      btn.classList.remove('loading'); btn.disabled=false;
      return;
    }
  } catch(e){
    const msgs = {
      'Invalid login credentials':'Email atau password salah.',
      'Email not confirmed':'Konfirmasi email kamu dulu — cek inbox/spam.',
      'User already registered':'Email sudah terdaftar. Silakan masuk.',
      'Password should be at least 6 characters':'Password minimal 6 karakter.',
    };
    showAlert(msgs[e.message] || e.message);
    btn.classList.remove('loading'); btn.disabled=false;
  }
};

/* ── FORGOT PASSWORD ── */
window.doForgot = async () => {
  const email = document.getElementById('emailIn').value.trim();
  if(!email){ showAlert('Masukkan email kamu dulu.'); return; }
  const{error} = await sb.auth.resetPasswordForEmail(email,{
    redirectTo: window.location.origin + '/pages/login.html'
  });
  if(error) showAlert('Gagal kirim email reset: '+error.message);
  else showAlert('Email reset telah dikirim! Cek inbox kamu.','ok');
};

/* ── AUTH STATE CHANGE ── */
sb.auth.onAuthStateChange((event, session) => {
  if(event==='SIGNED_IN' && session?.user){
    redirect(session.user.email);
  }
});

/* ── INIT ── */
(async()=>{
  const alreadyLoggedIn = await checkSession();
  if(alreadyLoggedIn) return;
  await loadMedia();
  setTimeout(()=>{
    document.getElementById('pgLoader').classList.add('out');
    setTimeout(()=>document.getElementById('pgLoader').remove(), 500);
  }, 600);
})();
</script>
</body>
</html>
